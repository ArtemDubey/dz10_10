{% extends "base.html" %}

{% block title %}Редагувати тур{% endblock %}

{% block content %}
<h1>Редагувати тур</h1>
<p>Змініть необхідні поля та збережіть оновлену інформацію про тур.</p>

<form method="POST" class="tour-form">
    <label for="title">Назва туру:</label>
    <input type="text" id="title" name="title" value="{{ tour['title'] }}" required>

    <label for="description">Опис туру:</label>
    <textarea id="description" name="description" rows="4">{{ tour['description'] }}</textarea>

    <label for="price">Ціна за людину ($):</label>
    <input type="number" id="price" name="price" step="0.01" value="{{ tour['price'] }}" required min="0">

    <label for="image">Фото (посилання або шлях до файлу):</label>
    <input type="text" id="image" name="image" value="{{ tour['image'] }}" required>

    <!-- Вибір найкращого сезону із заповненням поточного значення -->
    <label for="season">Найкращий сезон:</label>
    <select id="season" name="season" style="padding: 14px 18px; font-size: 15px; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; background-color: rgba(15, 23, 42, 0.6); color: #ffffff; outline: none;">
        <option value="Зима" {% if tour['season'] == 'Зима' %}selected{% endif %}>Зима</option>
        <option value="Літо" {% if tour['season'] == 'Літо' %}selected{% endif %}>Літо</option>
        <option value="Осінь" {% if tour['season'] == 'Осінь' %}selected{% endif %}>Осінь</option>
        <option value="Весна" {% if tour['season'] == 'Весна' %}selected{% endif %}>Весна</option>
        <option value="Універсальний" {% if tour['season'] == 'Універсальний' or not tour['season'] %}selected{% endif %}>Універсальний (будь-який сезон)</option>
    </select>

    <button type="submit">Зберегти зміни</button>
</form>

<br>
<a href="{{ url_for('tours') }}" class="back-link">← Назад до списку турів</a>
{% endblock %}
